name: test-package

on:
  push:
    branches:
      - 'develop'
      - 'main'
    tags:
      - '**'
  pull_request:
  workflow_dispatch: {}

env:
  CMDSTAN_VERSION: "2.39.0"
  CACHE_NUMBER: 0

jobs:
  test-package:
    name: tests-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out github
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e .[test]

      - name: CmdStan installation cache
        uses: actions/cache@v4
        id: cmdstan-cache
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-cmdstan-${{ env.CMDSTAN_VERSION }}-${{ env.CACHE_NUMBER }}

      - name: Delete precompiled header (macOS)
        if: runner.os == 'macOS' && steps.cmdstan-cache.outputs.cache-hit == 'true'
        run: |
          rm -rf ~/.cmdstan/cmdstan-${{ env.CMDSTAN_VERSION }}/stan/src/stan/model/*.hpp.gch

      - name: Install CmdStan
        run: |
          install_cmdstan \
            --version "${{ env.CMDSTAN_VERSION }}" \
            --cores 2 \
            --verbose

      # ---------------------------------------------------------
      # macOS diagnostics
      # ---------------------------------------------------------

      - name: Check macOS architecture
        if: runner.os == 'macOS'
        run: |
          echo "Runner architecture:"
          uname -m

          echo "Python architecture:"
          python -c "import platform; print(platform.machine())"

          echo "Python:"
          python --version

          echo "Compiler:"
          clang++ --version

      - name: Inspect CmdStan TBB
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import cmdstanpy
          from pathlib import Path

          cmdstan = Path(cmdstanpy.cmdstan_path())
          tbb = cmdstan / "stan/lib/stan_math/lib/tbb"

          print("CmdStan:", cmdstan)
          print("TBB directory:", tbb)
          print()

          if not tbb.exists():
              raise RuntimeError(f"TBB directory does not exist: {tbb}")

          print("TBB files:")
          for path in sorted(tbb.iterdir()):
              print(" ", path.name)
          PY

      - name: Inspect macOS TBB libraries
        if: runner.os == 'macOS'
        run: |
          TBB_DIR="$(python - <<'PY'
          import cmdstanpy
          from pathlib import Path
          print(Path(cmdstanpy.cmdstan_path()) / "stan/lib/stan_math/lib/tbb")
          PY
          )"

          echo "TBB_DIR=$TBB_DIR"
          echo

          for lib in "$TBB_DIR"/*.dylib; do
            echo "========================================"
            echo "$lib"
            echo "========================================"

            file "$lib"

            echo
            echo "Dependencies:"
            otool -L "$lib"

            echo
            echo "TBB symbols:"
            nm -gU "$lib" | grep -E \
              'allocate_via_handler|deallocate_via_handler|task_scheduler_observer' \
              || true

            echo
          done

      # ---------------------------------------------------------

      - name: Run tests
        run: |
          pytest -v

  test-package-windows:
    name: tests-windows-py${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out github
        uses: actions/checkout@v4

      - name: Cache conda
        uses: actions/cache@v4
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('.github/windows-env.yml') }}

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          mamba-version: "*"
          channels: conda-forge
          channel-priority: true
          activate-environment: windows
          environment-file: .github/windows-env.yml
          auto-update-conda: true

      - name: Install package
        run: |
          pip install -e .[test]

      - name: Run tests
        run: |
          pytest -v
